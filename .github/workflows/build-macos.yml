name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build:css

      - name: Build macOS installer
        run: npx electron-builder --mac --x64 --arm64 --publish never

      - name: Smoke test the Parakeet native runtime (Apple Silicon build)
        run: |
          ELECTRON_RUN_AS_NODE=1 dist/mac-arm64/OpenFatoAI.app/Contents/MacOS/OpenFatoAI -e "const p=require('path');const s=require(p.join(p.dirname(process.execPath),'..','Resources','app.asar','node_modules','sherpa-onnx-node'));console.log('sherpa ok:', typeof s.OfflineRecognizer);if(typeof s.OfflineRecognizer!=='function')process.exit(1)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: openfatoai-macos
          path: dist/*.dmg
          retention-days: 90
