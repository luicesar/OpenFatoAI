name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build:css

      - name: Build Windows installer
        run: npx electron-builder --win --x64 --publish never

      - name: Smoke test the Parakeet native runtime
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          # Start-Process -Wait: calling a GUI exe with & does not set $LASTEXITCODE
          $p = Start-Process -FilePath "dist/win-unpacked/OpenFatoAI.exe" -ArgumentList "scripts/ci/sherpa-smoke.js" -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "sherpa-onnx smoke test failed (exit $($p.ExitCode))" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: openfatoai-windows-x64
          path: dist/*.exe
          retention-days: 90
