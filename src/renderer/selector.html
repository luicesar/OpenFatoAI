<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles/output.css" />
    <style>
      /* cursor crosshair cannot be done with Tailwind; canvas must fill viewport */
      body { cursor: crosshair; }
      canvas { display: block; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body class="m-0 p-0 overflow-hidden bg-black select-none">
    <canvas id="canvas"></canvas>
    <div id="hint"
      class="fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none
             bg-black/75 text-white text-sm px-4 py-2 rounded-lg shadow-lg whitespace-nowrap">
      Clique e arraste para selecionar a área &nbsp;·&nbsp;
      <kbd class="bg-white/20 text-white px-1.5 py-0.5 rounded text-xs font-mono">ESC</kbd>
      para cancelar
    </div>
    <script src="js/selector.js"></script>
  </body>
</html>
