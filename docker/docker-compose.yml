# OpenFatoAI — backend opcional (PostgreSQL + API).
# O app desktop funciona sem isto; suba esta stack só se quiser sincronizar as reuniões
# com o seu próprio servidor (Configurações → Sincronização).
#
# Uso:
#   cd docker
#   cp .env.example .env        # defina POSTGRES_PASSWORD
#   docker compose up -d --build
#   curl http://127.0.0.1:5000/health
#
# HTTPS para acesso pela internet (Caddy + certificado automático):
#   defina DOMAIN no .env e use:  docker compose --profile https up -d --build
#
# As migrações SQL são aplicadas pela própria API ao iniciar (backend/OpenFatoAI.Infrastructure/SQL).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openfatoai}
      POSTGRES_USER: ${POSTGRES_USER:-openfatoai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo docker/.env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # Só na máquina local, para administração (ex.: pgAdmin). Remova se não precisar.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openfatoai_user} -d ${POSTGRES_DB:-openfatoai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Database=${POSTGRES_DB:-openfatoai};Username=${POSTGRES_USER:-openfatoai_user};Password=${POSTGRES_PASSWORD}
      CorsSettings__Origins: ${CORS_ORIGINS:-file://}
      Security__ApiKey: ${SECURITY_API_KEY:-}
    ports:
      # Por padrão só acessível na própria máquina. Para uma rede privada, use o IP da rede;
      # para a internet, use o perfil "https" (abaixo) em vez de abrir esta porta.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Proxy HTTPS opcional (perfil "https"): certificado Let's Encrypt automático.
  # Requer um domínio apontando para este servidor e as portas 80 e 443 liberadas.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg_data:
  caddy_data:
  caddy_config:
